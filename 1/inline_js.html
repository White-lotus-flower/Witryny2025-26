<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline</title>
</head>
<body>
    <fieldset>
    <div>
        <textarea onfocus="this.style.backgroundColor='yellow'">Magda</textarea>
    </div>
    <p>
        <input type="text" onblur="this.style.textTransform='UpperCase'">
    </p>
    <p>
        <select>
            <option value="black" onchange="this.style.color='black'">black</option>
            <option value="brown" onchange="this.style.Color='brown'">brown</option>
            <option value="blue" onchange="this.style.color='blue'">blue</option>
            <option value="blueviolet">blueviolet</option>
            <option value="burlyworld">burlyworld</option>
            <option value="bisque">bisque</option>
        </select>
    </p>
    </fieldset>
</body>
</html>
